<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>动漫详情 - 资料库</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #ffd700;
            text-decoration: none;
            border: 1px solid #ffd700;
            padding: 8px 20px;
            border-radius: 30px;
            transition: 0.3s;
        }

        .back-link:hover {
            background: #ffd700;
            color: #000;
        }

        .anime-detail img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 20px 0;
        }

        .title {
            font-size: 2rem;
            margin: 20px 0;
            color: #ffd700;
        }

        .description {
            line-height: 1.6;
            color: #ccc;
            white-space: pre-wrap;
        }

        .info {
            margin-top: 20px;
            color: #aaa;
        }

        .info span {
            color: #ffd700;
        }

        .rating-section {
            margin: 30px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .rating-btn {
            background: #222;
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }

        .rating-btn.active {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 15px #ffd700;
        }

        .rating-btn:hover {
            background: #ffd700;
            color: #000;
        }

        .comment-section {
            margin-top: 40px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }

        .comment-form textarea {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            padding: 10px;
            font-family: inherit;
            resize: vertical;
        }

        .comment-submit {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            margin-top: 10px;
            cursor: pointer;
        }

        .comment {
            margin-bottom: 20px;
            padding: 15px;
            background: #111;
            border-radius: 12px;
            position: relative;
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .comment-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 1px solid #ffd700;
        }

        .comment-username {
            font-weight: bold;
            color: #ffd700;
            cursor: pointer;
        }

        .comment-date {
            font-size: 0.75rem;
            color: #888;
        }

        .comment-text {
            margin: 8px 0;
            line-height: 1.4;
        }

        .reply-btn {
            font-size: 0.8rem;
            color: #aaa;
            cursor: pointer;
            margin-top: 5px;
            display: inline-block;
        }

        .reply-btn:hover {
            color: #ffd700;
        }

        .delete-comment {
            font-size: 0.75rem;
            color: #f66;
            cursor: pointer;
            margin-left: 15px;
            float: right;
        }

        .delete-comment:hover {
            color: #ff0000;
        }

        .replies {
            margin-left: 50px;
            margin-top: 15px;
            border-left: 2px solid #333;
            padding-left: 20px;
        }

        .reply-form {
            margin-top: 10px;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            max-width: 300px;
            text-align: center;
            border: 1px solid #ffd700;
        }

        .modal-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .friend-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 6px 15px;
            border-radius: 30px;
            margin-top: 10px;
            cursor: pointer;
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid #ffd700;
            border-radius: 40px;
            padding: 12px 24px;
            color: #ffd700;
            font-size: 1rem;
            font-weight: bold;
            z-index: 100000;
            white-space: nowrap;
            animation: fadeInOut 2s ease forwards;
            pointer-events: none;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            85% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }

        .avatar-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
            border: 1px solid #000;
            display: none;
            z-index: 1001;
        }

        #userAvatarMenu {
            position: relative;
        }

        .msg-tabs {
            display: flex;
            border-bottom: 1px solid #444;
            margin-bottom: 15px;
        }

        .msg-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            color: #aaa;
            transition: 0.2s;
        }

        .msg-tab.active {
            color: #ffd700;
            border-bottom: 2px solid #ffd700;
        }

        .msg-panel {
            display: none;
        }

        .msg-panel.active {
            display: block;
        }

        .msg-item {
            padding: 12px;
            border-bottom: 1px solid #333;
            cursor: pointer;
        }

        .msg-item:hover {
            background: #222;
        }

        .friend-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 12px;
            vertical-align: middle;
        }

        .friend-name {
            display: inline-block;
            vertical-align: middle;
        }

        .red-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff0000;
            border-radius: 50%;
            margin-left: 8px;
            vertical-align: middle;
        }

        #notificationBar {
            display: none;
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffd700;
            color: #000;
            padding: 8px 16px;
            border-radius: 30px;
            z-index: 100000;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        #sideMenu {
            position: fixed;
            left: -280px;
            top: 0;
            width: 280px;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 2000;
            transition: left 0.3s;
            border-right: 1px solid #ffd700;
        }

        #chatModal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 500px;
            height: 70%;
            background: #1a1a1a;
            border: 1px solid #ffd700;
            border-radius: 20px;
            z-index: 100001;
            flex-direction: column;
            overflow: hidden;
        }

        #chatSettingsMenu {
            display: none;
            position: absolute;
            background: #222;
            border: 1px solid #ffd700;
            border-radius: 8px;
            z-index: 100002;
        }

        #chatSettingsMenu div {
            padding: 10px 20px;
            cursor: pointer;
            color: #fff;
        }

        #chatSettingsMenu div:hover {
            background: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="javascript:history.back()" class="back-link">← 返回</a>
        <div id="animeDetail">加载中...</div>
        <div id="ratingPanel" style="margin: 20px 0;"></div>
        <div id="commentSection" class="comment-section"></div>
    </div>
    <div id="userModal" class="modal">
        <div class="modal-content">
            <img id="modalAvatar" class="modal-avatar"
                src="https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp">
            <h3 id="modalUsername"></h3>
            <p id="modalBio"></p>
            <p id="modalJoinDate"></p>
            <button id="addFriendBtn" class="friend-btn">➕ 添加好友</button>
            <button onclick="closeModal()" class="friend-btn" style="background:#444;">关闭</button>
        </div>
    </div>

    <!-- 全局通知条 -->
    <div id="notificationBar"
        style="display:none; position:fixed; top:10px; left:50%; transform:translateX(-50%); background:#ffd700; color:#000; padding:8px 16px; border-radius:30px; z-index:100000; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.2);">
        <span id="notificationMsg"></span>
        <button id="closeNotifBtn"
            style="margin-left:10px; background:transparent; border:none; cursor:pointer;">✖</button>
    </div>

    <!-- 侧边栏消息中心 -->
    <div id="sideMenu"
        style="position: fixed; left: -280px; top: 0; width: 280px; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); z-index: 2000; transition: left 0.3s; border-right: 1px solid #ffd700;">
        <div style="padding: 20px; display: flex; flex-direction: column; height: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="color:#ffd700;">消息中心</h3>
                <button id="closeSideMenuBtn"
                    style="background:transparent; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">✖</button>
            </div>
            <div class="msg-tabs">
                <div class="msg-tab active" data-tab="messages">消息</div>
                <div class="msg-tab" data-tab="friends">好友</div>
                <div class="msg-tab" data-tab="settings">设置</div>
            </div>
            <div id="messagesPanel" class="msg-panel active">
                <div id="notificationList">加载中...</div>
            </div>
            <div id="friendsPanel" class="msg-panel">
                <div id="friendsList">加载中...</div>
            </div>
            <div id="settingsPanel" class="msg-panel">
                <div style="margin-top:15px;"><label style="color:#fff;">新消息提醒音效</label><input type="checkbox"
                        id="soundCheckbox" checked></div>
                <div style="margin-top:15px;"><label style="color:#fff;">桌面通知</label><input type="checkbox"
                        id="desktopNotifyCheckbox"></div>
                <div style="margin-top:15px;">
                    <button id="feedbackBtn"
                        style="background:#ffd700; color:#000; border:none; padding:8px 20px; border-radius:30px; cursor:pointer;">💬
                        意见反馈</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 聊天模态框 -->
    <div id="chatModal" style="display: none;">
        <div
            style="padding:15px; background:#111; border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center;">
            <span id="chatFriendName" style="color:#ffd700;"></span>
            <div><button id="chatSettingsBtn"
                    style="background:transparent; border:none; color:#fff; cursor:pointer;">⚙️</button><button
                    id="closeChatBtn"
                    style="background:transparent; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">✖</button>
            </div>
        </div>
        <div id="chatMessages"
            style="flex:1; overflow-y: auto; padding:15px; display:flex; flex-direction:column; gap:10px;"></div>
        <div style="padding:15px; border-top:1px solid #333; display:flex; gap:10px;">
            <input type="text" id="chatInput" placeholder="输入消息..."
                style="flex:1; background:#111; border:1px solid #444; color:#fff; border-radius:20px; padding:8px 15px;">
            <button id="sendChatBtn"
                style="background:#ffd700; color:#000; border:none; border-radius:30px; padding:8px 20px;">发送</button>
        </div>
    </div>
    <div id="chatSettingsMenu" style="display:none; position:absolute;">
        <div id="setNoteBtn">✏️ 设置备注</div>
        <div id="deleteFriendBtn">删除好友</div>
        <div id="muteFriendBtn">消息免打扰</div>
        <div id="blockFriendBtn">拉黑</div>
    </div>

    <!-- 反馈模态框 -->
    <div id="reportModal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10001; backdrop-filter: blur(5px); align-items: center; justify-content: center;">
        <div
            style="background: #1a1a1a; border-radius: 20px; max-width: 500px; width: 90%; margin: 20px auto; padding: 20px; border: 1px solid #ffd700; max-height: 90vh; overflow-y: auto;">
            <h3 style="color: #ffd700; text-align: center; margin-bottom: 20px;">意见反馈</h3>
            <div>
                <label style="color: #ffd700;">问题类型</label>
                <select id="reportType"
                    style="width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 8px; margin-top: 5px;">
                    <option value="bug">🐛 Bug</option>
                    <option value="optimize">✨ 优化建议</option>
                    <option value="suggestion">💡 意见</option>
                    <option value="question">❓ 疑问</option>
                </select>
            </div>
            <div style="margin-top: 15px;">
                <label style="color: #ffd700;">问题描述</label>
                <textarea id="reportDesc" rows="4"
                    style="width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 8px; resize: vertical;"
                    placeholder="请详细描述您遇到的问题或建议..."></textarea>
            </div>
            <div style="margin-top: 15px;">
                <label style="color: #ffd700;">上传截图（可选）</label>
                <input type="file" id="reportImage" accept="image/jpeg,image/png,image/webp"
                    style="margin-top: 5px; color: #fff;">
                <div id="imagePreview" style="margin-top: 10px; max-width: 100%; overflow-x: auto;"></div>
                <p style="font-size: 0.7rem; color: #888;">最多一张，建议小于2MB</p>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 15px; justify-content: center;">
                <button id="submitReportBtn"
                    style="background: #ffd700; color: #000; border: none; padding: 10px 25px; border-radius: 30px; cursor: pointer;">提交反馈</button>
                <button id="closeReportBtn"
                    style="background: #444; color: #fff; border: none; padding: 10px 25px; border-radius: 30px; cursor: pointer;">取消</button>
            </div>
        </div>
    </div>

    <!-- 左下角头像菜单 -->
    <div id="userAvatarMenu" style="position: fixed; left: 20px; bottom: 20px; z-index: 1000; cursor: pointer;">
        <img id="avatarIcon" src="https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp"
            style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid #ffd700; object-fit: cover;">
        <div id="avatarBadge" class="avatar-badge"></div>
    </div>

    <script>
        // === 全局函数 ===
        function showToast(message, duration = 2000) {
            const existingToast = document.querySelector('.toast-message');
            if (existingToast) existingToast.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, duration);
        }

        async function authFetch(url, options = {}) {
            options.credentials = 'include';
            if (options.body && typeof options.body === 'object') {
                options.body = JSON.stringify(options.body);
                options.headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            }
            return fetch(url, options);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // --- 动漫详情相关代码 ---
        let currentAnime = null;
        let currentUserEmail = null;

        async function fetchCurrentUser() {
            try {
                const res = await fetch('/api/user/current', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    currentUserEmail = data.email;
                    // 更新左下角头像
                    const avatarIcon = document.getElementById('avatarIcon');
                    if (avatarIcon && data.avatar) {
                        avatarIcon.src = data.avatar;
                    }
                    // 同步到 localStorage
                    let profile = JSON.parse(localStorage.getItem('user_profile') || '{}');
                    profile.avatar = data.avatar;
                    localStorage.setItem('user_profile', JSON.stringify(profile));
                } else {
                    currentUserEmail = null;
                }
            } catch (e) {
                currentUserEmail = null;
            }
        }

        async function loadAnime() {
            const pathId = window.location.pathname.split('/').pop();
            if (!pathId) {
                document.getElementById('animeDetail').innerHTML = '<div>无效的动漫ID</div>';
                return;
            }
            const res = await fetch(`/api/anime/${pathId}?_=${Date.now()}`, { credentials: 'include' });
            if (!res.ok) {
                document.getElementById('animeDetail').innerHTML = '<div>动漫加载失败</div>';
                return;
            }
            currentAnime = await res.json();
            renderAnimeDetail();
            renderComments();
            renderRatingButtons();
        }

        function renderAnimeDetail() {
            const html = `<div class="anime-detail"><h1 class="title">${escapeHtml(currentAnime.title)}</h1><img src="${currentAnime.image_url}" alt="${currentAnime.title}" onerror="this.src='/images/default.jpg'"><div class="description">${escapeHtml(currentAnime.description || '暂无简介')}</div><div class="info"><p><span>推荐指数：</span>${escapeHtml(currentAnime.recommend_text || '暂无')}</p><p><span>题材：</span>${currentAnime.genre ? escapeHtml(currentAnime.genre.join('、')) : '暂无'}</p><p><span>系列：</span>${escapeHtml(currentAnime.series_title || '独立作品')}</p><p><span>首播：</span>${escapeHtml(currentAnime.season || '无')}</p></div></div>`;
            document.getElementById('animeDetail').innerHTML = html;
        }

        // 渲染评分按钮（高亮当前用户评分）
        function renderRatingButtons() {
            const ratings = ['神作', '好看', '普通', '无聊', '狗屎'];
            const container = document.getElementById('ratingPanel');
            container.innerHTML = '<strong>评分：</strong> ';
            // ★ 关键修改：使用后端返回的 currentUserRating，而不是 user_ratings
            let userRating = currentAnime.currentUserRating || null;
            ratings.forEach(r => {
                const btn = document.createElement('button');
                btn.textContent = r;
                btn.className = 'rating-btn';
                if (userRating === r) btn.classList.add('active');
                btn.onclick = () => rateAnime(r, btn);
                container.appendChild(btn);
            });
        }

        // 评分核心：转换模式，局部更新
        async function rateAnime(ratingType, btnElement) {
            const isActive = btnElement.classList.contains('active');
            console.log('当前动漫 ID:', currentAnime._id);
            // 关键：使用 currentAnime.id（数字）或 currentAnime._id（字符串）
            const animeId = currentAnime._id;
            if (!animeId) {
                showToast('动漫 ID 无效');
                return;
            }
            if (isActive) {
                // 取消评分
                const res = await authFetch('/api/anime/unrate', { method: 'POST', body: { id: currentAnime._id } });
                const data = await res.json();
                if (data.success) {
                    showToast(`已取消 ${ratingType} 评分`);
                    if (data.ratings) currentAnime.ratings = data.ratings;
                    // 清空当前用户的评分标记
                    currentAnime.currentUserRating = null;
                    renderRatingButtons();
                } else {
                    showToast(data.error || '取消评分失败');
                }
            } else {
                // 提交评分
                const res = await authFetch('/api/anime/rate', { method: 'POST', body: { id: currentAnime._id, ratingType } });
                if (res.ok) {
                    const data = await res.json();
                    showToast(`已评为 ${ratingType}`);
                    if (data.ratings) currentAnime.ratings = data.ratings;
                    // 保存当前用户的评分类型
                    currentAnime.currentUserRating = ratingType;
                    renderRatingButtons();
                } else {
                    const err = await res.json();
                    showToast(err.error || '评分失败，请登录');
                }
            }
        }

        // 评论相关
        function renderComments() {
            const container = document.getElementById('commentSection');
            container.innerHTML = '';
            if (!currentAnime.comments) currentAnime.comments = [];
            container.innerHTML = `<h3>评论 (${currentAnime.comments.length})</h3><div class="comment-form"><textarea id="newCommentText" rows="2" placeholder="发表评论..."></textarea><button class="comment-submit" onclick="submitComment()">发表评论</button></div><div id="commentsList"></div>`;
            const commentsDiv = document.getElementById('commentsList');
            commentsDiv.innerHTML = '';
            currentAnime.comments.forEach(comment => { commentsDiv.appendChild(createCommentElement(comment)); });
        }

        function createCommentElement(comment, parentId = null) {
            const div = document.createElement('div');
            div.className = 'comment';
            div.dataset.id = comment.id;
            const isOwner = (currentUserEmail && comment.userId === currentUserEmail);
            const deleteBtn = isOwner ? `<span class="delete-comment" data-id="${comment.id}">🗑️ 删除</span>` : '';
            div.innerHTML = `<div class="comment-header"><img class="comment-avatar" src="${comment.avatar || 'https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp'}" onerror="this.src='https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp'" data-email="${comment.userId}"><span class="comment-username" data-email="${comment.userId}">${escapeHtml(comment.username)}</span><span class="comment-date">${new Date(comment.date).toLocaleString()}</span>${deleteBtn}</div><div class="comment-text">${escapeHtml(comment.text)}</div><div class="reply-btn" data-id="${comment.id}">💬 回复</div><div id="reply-form-${comment.id}" class="reply-form"><textarea rows="2" placeholder="回复..."></textarea><button class="comment-submit" onclick="submitReply('${comment.id}')">提交回复</button></div>`;
            if (isOwner) {
                const delBtn = div.querySelector('.delete-comment');
                delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteComment(comment.id); });
            }
            const replyBtn = div.querySelector('.reply-btn');

        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = (height * maxWidth) / width;
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            const reader2 = new FileReader();
                            reader2.onload = () => resolve(reader2.result);
                            reader2.readAsDataURL(blob);
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        if (submitReportBtn) {
            submitReportBtn.addEventListener('click', async () => {
                const type = reportType.value;
                const description = reportDesc.value.trim();
                if (!description) { showToast('请填写问题描述'); return; }
                const file = reportImage.files[0];
                let imageBase64 = null;
                if (file) {
                    if (file.size > 10 * 1024 * 1024) { showToast('图片不能超过 10MB'); return; }
                    imageBase64 = await compressImage(file);
                }
                const payload = { type, description, imageBase64: imageBase64 || null };
                try {
                    const res = await fetch('/api/report', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast('反馈已提交，感谢您的支持！');
                        closeReportModal();
                    } else showToast('提交失败：' + (data.error || '请稍后重试'));
                } catch (err) { showToast('网络错误，请重试'); }
            });
        }
    </script>
</body>

</html>
