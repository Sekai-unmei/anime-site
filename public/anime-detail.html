<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>动漫详情 - 资料库</title>
    <style>
        /* 原有样式保持不变，只增加以下样式 */
        body {
            margin: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #ffd700;
            text-decoration: none;
            border: 1px solid #ffd700;
            padding: 8px 20px;
            border-radius: 30px;
            transition: 0.3s;
        }

        .back-link:hover {
            background: #ffd700;
            color: #000;
        }

        .anime-detail img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 20px 0;
        }

        .title {
            font-size: 2rem;
            margin: 20px 0;
            color: #ffd700;
        }

        .description {
            line-height: 1.6;
            color: #ccc;
            white-space: pre-wrap;
        }

        .info {
            margin-top: 20px;
            color: #aaa;
        }

        .info span {
            color: #ffd700;
        }

        .rating-section {
            margin: 30px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .rating-btn {
            background: #222;
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }

        .rating-btn.active {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 15px #ffd700;
        }

        .rating-btn:hover {
            background: #ffd700;
            color: #000;
        }

        .comment-section {
            margin-top: 40px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }

        .comment-form textarea {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            padding: 10px;
            font-family: inherit;
            resize: vertical;
        }

        .comment-submit {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            margin-top: 10px;
            cursor: pointer;
        }

        .comment {
            margin-bottom: 20px;
            padding: 15px;
            background: #111;
            border-radius: 12px;
            position: relative;
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .comment-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 1px solid #ffd700;
        }

        .comment-username {
            font-weight: bold;
            color: #ffd700;
            cursor: pointer;
        }

        .comment-date {
            font-size: 0.75rem;
            color: #888;
        }

        .comment-text {
            margin: 8px 0;
            line-height: 1.4;
        }

        .reply-btn {
            font-size: 0.8rem;
            color: #aaa;
            cursor: pointer;
            margin-top: 5px;
            display: inline-block;
        }

        .reply-btn:hover {
            color: #ffd700;
        }

        .delete-comment {
            font-size: 0.75rem;
            color: #f66;
            cursor: pointer;
            margin-left: 15px;
            float: right;
        }

        .delete-comment:hover {
            color: #ff0000;
        }

        .replies {
            margin-left: 50px;
            margin-top: 15px;
            border-left: 2px solid #333;
            padding-left: 20px;
        }

        .reply-form {
            margin-top: 10px;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            max-width: 300px;
            text-align: center;
            border: 1px solid #ffd700;
        }

        .modal-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .friend-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 6px 15px;
            border-radius: 30px;
            margin-top: 10px;
            cursor: pointer;
        }

        /* Toast 提示 */
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid #ffd700;
            border-radius: 40px;
            padding: 12px 24px;
            color: #ffd700;
            font-size: 1rem;
            font-weight: bold;
            z-index: 100000;
            white-space: nowrap;
            animation: fadeInOut 2s ease forwards;
            pointer-events: none;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            85% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="javascript:history.back()" class="back-link">← 返回</a>
        <div id="animeDetail">加载中...</div>
        <div id="ratingPanel" style="margin: 20px 0;"></div>
        <div id="commentSection" class="comment-section"></div>
    </div>
    <div id="userModal" class="modal">
        <div class="modal-content">
            <img id="modalAvatar" class="modal-avatar" src="">
            <h3 id="modalUsername"></h3>
            <p id="modalBio"></p>
            <p id="modalJoinDate"></p>
            <button id="addFriendBtn" class="friend-btn">➕ 添加好友</button>
            <button onclick="closeModal()" class="friend-btn" style="background:#444;">关闭</button>
        </div>
    </div>

    <script>
        // ====== 添加 showToast 函数 ======
        function showToast(message, duration = 2000) {
            const existingToast = document.querySelector('.toast-message');
            if (existingToast) existingToast.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, duration);
        }

        let animeId = window.location.pathname.split('/').pop();
        let currentAnime = null;
        let currentUserEmail = null;

        async function fetchCurrentUser() {
            try {
                const res = await fetch('/api/user/current', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    currentUserEmail = data.email;
                } else {
                    currentUserEmail = null;
                }
            } catch (e) {
                currentUserEmail = null;
            }
        }

        async function authFetch(url, options = {}) {
            options.credentials = 'include';
            if (options.body && typeof options.body === 'object') {
                options.body = JSON.stringify(options.body);
                options.headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            }
            return fetch(url, options);
        }

        async function loadAnime() {
            // 添加时间戳防止任何形式的缓存
            const timestamp = Date.now();
            const res = await fetch(`/api/anime/${animeId}?_=${timestamp}`, {
                credentials: 'include',
                headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' },
                cache: 'no-store'
            });
            currentAnime = await res.json();
            renderAnimeDetail();
            renderComments();
            renderRatingButtons();
        }
        function renderAnimeDetail() {
            const html = `
            <div class="anime-detail">
                <h1 class="title">${escapeHtml(currentAnime.title)}</h1>
                <img src="${currentAnime.image_url}" alt="${currentAnime.title}" onerror="this.src='/images/default.jpg'">
                <div class="description">${escapeHtml(currentAnime.description || '暂无简介')}</div>
                <div class="info">
                    <p><span>推荐指数：</span>${escapeHtml(currentAnime.recommend_text || '暂无')}</p>
                    <p><span>题材：</span>${currentAnime.genre ? escapeHtml(currentAnime.genre.join('、')) : '暂无'}</p>
                    <p><span>系列：</span>${escapeHtml(currentAnime.series_title || '独立作品')}</p>
                    <p><span>首播：</span>${escapeHtml(currentAnime.season || '无')}</p>
                </div>
            </div>
        `;
            document.getElementById('animeDetail').innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        async function renderRatingButtons() {
            const ratings = ['神作', '好看', '普通', '无聊', '狗屎'];
            const container = document.getElementById('ratingPanel');
            container.innerHTML = '<strong>评分：</strong> ';
            let userRating = null;
            if (currentUserEmail && currentAnime.user_ratings && currentAnime.user_ratings[currentUserEmail]) {
                userRating = currentAnime.user_ratings[currentUserEmail];
            }
            ratings.forEach(r => {
                const btn = document.createElement('button');
                btn.textContent = r;
                btn.className = 'rating-btn';
                if (userRating === r) btn.classList.add('active');
                btn.onclick = () => rateAnime(r, btn);
                container.appendChild(btn);
            });
        }

        async function rateAnime(ratingType, btnElement) {
            const isActive = btnElement.classList.contains('active');
            if (isActive) {
                try {
                    const res = await authFetch('/api/anime/unrate', { method: 'POST', body: { id: animeId } });
                    const data = await res.json();
                    if (data.success) {
                        showToast(`已取消 ${ratingType} 评分`);
                        await loadAnime();
                    } else {
                        showToast(data.error || '取消评分失败');
                    }
                } catch (err) {
                    showToast('网络错误');
                }
            } else {
                const res = await authFetch('/api/anime/rate', { method: 'POST', body: { id: animeId, ratingType } });
                if (res.ok) {
                    showToast(`已评为 ${ratingType}`);
                    await loadAnime();
                } else {
                    const err = await res.json();
                    showToast(err.error || '评分失败，请登录');
                }
            }
        }

        function renderComments() {
            const container = document.getElementById('commentSection');
            container.innerHTML = ''; // 彻底清空，避免残留
            if (!currentAnime.comments) currentAnime.comments = [];
            container.innerHTML = `
            <h3>评论 (${currentAnime.comments.length})</h3>
            <div class="comment-form">
                <textarea id="newCommentText" rows="2" placeholder="发表评论..."></textarea>
                <button class="comment-submit" onclick="submitComment()">发表评论</button>
            </div>
            <div id="commentsList"></div>
        `;
            const commentsDiv = document.getElementById('commentsList');
            commentsDiv.innerHTML = '';
            currentAnime.comments.forEach(comment => {
                commentsDiv.appendChild(createCommentElement(comment));
            });
        }

        function createCommentElement(comment, parentId = null) {
            const div = document.createElement('div');
            div.className = 'comment';
            div.dataset.id = comment.id;
            const isOwner = (currentUserEmail && comment.userId === currentUserEmail);
            const deleteBtn = isOwner ? `<span class="delete-comment" data-id="${comment.id}">🗑️ 删除</span>` : '';
            div.innerHTML = `
            <div class="comment-header">
                <img class="comment-avatar" src="${comment.avatar}" onerror="this.src='/avatars/default.png'" data-email="${comment.userId}">
                <span class="comment-username" data-email="${comment.userId}">${escapeHtml(comment.username)}</span>
                <span class="comment-date">${new Date(comment.date).toLocaleString()}</span>
                ${deleteBtn}
            </div>
            <div class="comment-text">${escapeHtml(comment.text)}</div>
            <div class="reply-btn" data-id="${comment.id}">💬 回复</div>
            <div id="reply-form-${comment.id}" class="reply-form">
                <textarea rows="2" placeholder="回复..."></textarea>
                <button class="comment-submit" onclick="submitReply('${comment.id}')">提交回复</button>
            </div>
        `;
            if (isOwner) {
                const delBtn = div.querySelector('.delete-comment');
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteComment(comment.id);
                });
            }
            const replyBtn = div.querySelector('.reply-btn');
            replyBtn.onclick = (e) => {
                e.stopPropagation();
                const form = document.getElementById(`reply-form-${comment.id}`);
                form.style.display = form.style.display === 'block' ? 'none' : 'block';
            };
            div.querySelectorAll('.comment-avatar, .comment-username').forEach(el => {
                el.addEventListener('click', () => showUserInfo(el.dataset.email));
            });
            if (comment.replies && comment.replies.length) {
                const repliesDiv = document.createElement('div');
                repliesDiv.className = 'replies';
                comment.replies.forEach(reply => {
                    repliesDiv.appendChild(createCommentElement(reply, comment.id));
                });
                div.appendChild(repliesDiv);
            }
            return div;
        }

        async function deleteComment(commentId) {
            const res = await authFetch(`/api/anime/${animeId}/comment/${commentId}`, { method: 'DELETE' });
            if (res.ok) {
                showToast('评论已删除');
                loadAnime();
            } else {
                const err = await res.json();
                showToast(err.error || '删除失败');
            }
        }

        async function submitComment() {
            const textarea = document.getElementById('newCommentText');
            const text = textarea.value.trim();
            if (!text) return;
            const res = await authFetch(`/api/anime/${animeId}/comment`, { method: 'POST', body: { text } });
            if (res.ok) {
                textarea.value = '';
                loadAnime();
            } else {
                const err = await res.json();
                showToast(err.error || '评论失败，请登录');
            }
        }

        async function submitReply(parentId) {
            const formDiv = document.getElementById(`reply-form-${parentId}`);
            const textarea = formDiv.querySelector('textarea');
            const text = textarea.value.trim();
            if (!text) return;
            const res = await authFetch(`/api/anime/${animeId}/comment`, { method: 'POST', body: { parentId, text } });
            if (res.ok) {
                textarea.value = '';
                formDiv.style.display = 'none';
                loadAnime();
            } else {
                showToast('回复失败');
            }
        }

        const modal = document.getElementById('userModal');
        async function showUserInfo(email) {
            try {
                const res = await fetch(`/api/user/info/${encodeURIComponent(email)}`, { credentials: 'include' });
                if (!res.ok) throw new Error();
                const user = await res.json();
                document.getElementById('modalAvatar').src = user.avatar;
                document.getElementById('modalUsername').innerText = user.username;
                document.getElementById('modalBio').innerText = user.bio;
                document.getElementById('modalJoinDate').innerText = '加入于 ' + user.joinDate;
                const addBtn = document.getElementById('addFriendBtn');
                addBtn.onclick = () => addFriend(email);
                modal.style.display = 'flex';
            } catch (e) {
                showToast('无法获取用户信息');
            }
        }

        function closeModal() { modal.style.display = 'none'; }
        window.closeModal = closeModal;

        async function addFriend(toEmail) {
            const res = await authFetch('/api/friends/request', { method: 'POST', body: { toEmail } });
            const data = await res.json();
            if (data.success) {
                showToast('好友请求已发送');
            } else {
                showToast(data.error || '请求失败');
            }
        }

        (async () => {
            await fetchCurrentUser();
            await loadAnime();
        })();
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    </script>
</body>

</html>
