<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fate系列 · 观测者推荐顺序 | 动漫资料库</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        color: #eee;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        margin: 0;
        padding: 0;
      }
      .fate-container {
        max-width: 1300px;
        margin: 0 auto;
        padding: 2rem 1.5rem;
      }
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        margin-bottom: 2rem;
        border-bottom: 1px solid #2a2a2a;
        padding-bottom: 1rem;
      }
      .title-area h1 {
        margin: 0;
        font-size: 2rem;
        background: linear-gradient(135deg, #e6b422, #c79b2e);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
      }
      .back-home {
        background: #1e1e1e;
        padding: 0.5rem 1.2rem;
        border-radius: 40px;
        text-decoration: none;
        color: #ffd966;
        border: 1px solid #ffd966;
        transition: 0.2s;
      }
      .back-home:hover {
        background: #ffd966;
        color: #0a0a0a;
      }
      .intro-card {
        background: linear-gradient(145deg, #11181f, #0a0f12);
        border-left: 5px solid #d9a13b;
        padding: 1.2rem 2rem;
        border-radius: 24px;
        margin-bottom: 2.5rem;
      }
      .series-group {
        margin-bottom: 3rem;
      }
      .group-title {
        font-size: 1.8rem;
        font-weight: 600;
        border-left: 5px solid #e6b422;
        padding-left: 18px;
        margin-bottom: 0.5rem;
      }
      .group-desc {
        color: #aaa;
        margin-left: 23px;
        margin-bottom: 1.5rem;
      }
      .anime-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 24px;
      }
      .anime-card {
        background: #151515;
        border-radius: 20px;
        overflow: hidden;
        cursor: pointer;
        transition: 0.25s;
        border: 1px solid #262626;
      }
      .anime-card:hover {
        transform: translateY(-6px);
        border-color: #e6b422;
      }
      .card-img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }
      .card-info {
        padding: 1rem;
      }
      .card-title {
        font-size: 1.1rem;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
      }
      .card-year {
        font-size: 0.7rem;
        background: #2a2a2a;
        padding: 0.2rem 0.6rem;
        border-radius: 30px;
      }
      .card-desc {
        font-size: 0.8rem;
        color: #aaa;
        margin-top: 8px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .loading-state {
        text-align: center;
        padding: 3rem;
        color: #ffd966;
      }
      footer {
        text-align: center;
        margin-top: 3rem;
        padding: 1.5rem;
        border-top: 1px solid #222;
        font-size: 0.75rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="fate-container">
      <div class="page-header">
        <div class="title-area">
          <h1>✧ Fate 观测序列 ✧</h1>
          <p>根据英灵殿推荐 · 正确打开月世界的观看手册</p>
        </div>
        <a href="/" class="back-home">← 返回观测站</a>
      </div>
      <div class="intro-card">
        <p>
          ✨ 「非粉丝向观影指南」—— 以「剧情时间线 + 最佳体验顺序」综合整理。
        </p>
        <p>📖 点击任意卡片跳转至详细观测档案。</p>
        <div
          class="watch-order-tip"
          style="font-weight: bold; color: #ffd966; margin-top: 0.8rem"
        >
          ⭐ 推荐顺序：Zero → UBW → HF → 二世事件簿 → FGO → 伊莉雅 → 嘉年华
        </div>
      </div>
      <div id="fate-content">
        <div class="loading-state">
          ⚡ 正在从穹顶数据库调取 Fate 系列记录...
        </div>
      </div>
      <footer>观测者 · 圣杯战争编年史</footer>
    </div>
    <script src="/js/common.js"></script>
    <script>
      const GROUP_CONFIG = [
        {
          name: "⚔️ 圣杯战争 · 主线核心轨迹",
          desc: "零之起点 → 无限剑制 → 天之杯",
          ids: [669, 670, 664, 665, 666, 667, 668, 671],
        },
        {
          name: "🌙 正传衍生 · 魔术师与从者们",
          desc: "Apocrypha、Extra、strange Fake、事件簿等",
          ids: [674, 675, 672, 673, 683, 690],
        },
        {
          name: "📀 Fate/Grand Order 人理修复篇",
          desc: "序章到第七特异点·巴比伦尼亚，终局所罗门",
          ids: [684, 685, 686, 687, 688, 689],
        },
        {
          name: "✨ 魔法少女☆伊莉雅 (平行世界)",
          desc: "伊莉雅的魔法少女平行世界",
          ids: [676, 677, 678, 679, 680, 681, 682],
        },
        {
          name: "🎭 英灵日常 · 嘉年华 & 泡面番",
          desc: "卫宫家的饭、幻想嘉年华、FGO搞笑短片",
          ids: [656, 691, 692, 693, 694, 695],
        },
      ];
      async function fetchAll() {
        let r = await fetch("/api/anime/list?page=1&limit=600");
        let j = await r.json();
        return j.data || [];
      }
      function createCard(a) {
        let c = document.createElement("div");
        c.className = "anime-card";
        let img = a.image_url || "/images/default.jpg";
        let year = "";
        if (a.season) {
          let m = a.season.match(/^(\d{4})/);
          if (m) year = m[1];
        }
        let desc = (a.description || "暂无简介").slice(0, 80);
        c.innerHTML = `<div><img class="card-img" src="${img}" onerror="this.src='/images/default.jpg'"></div><div class="card-info"><div class="card-title"><span>${escapeHtml(a.title)}</span>${year ? `<span class="card-year">${year}</span>` : ""}</div><div class="card-desc">${escapeHtml(desc)}</div></div>`;
        c.onclick = () => {
          window.location.href = `/anime/${a._id || a.id}`;
        };
        return c;
      }
      function escapeHtml(s) {
        if (!s) return "";
        return s.replace(/[&<>]/g, function (m) {
          if (m === "&") return "&amp;";
          if (m === "<") return "&lt;";
          if (m === ">") return "&gt;";
          return m;
        });
      }
      async function init() {
        let cont = document.getElementById("fate-content");
        let all = await fetchAll();
        let map = new Map();
        all.forEach((a) => {
          let nid = typeof a.id === "number" ? a.id : parseInt(a.id, 10);
          if (!isNaN(nid)) map.set(nid, a);
        });
        cont.innerHTML = "";
        for (let g of GROUP_CONFIG) {
          let gdiv = document.createElement("div");
          gdiv.className = "series-group";
          gdiv.innerHTML = `<div class="group-title">${g.name}</div><div class="group-desc">${g.desc}</div>`;
          let grid = document.createElement("div");
          grid.className = "anime-grid";
          let has = false;
          for (let id of g.ids) {
            let an = map.get(id);
            if (an) {
              has = true;
              grid.appendChild(createCard(an));
            }
          }
          if (!has) {
            let p = document.createElement("div");
            p.style.cssText =
              "color:#777;padding:1rem;text-align:center;grid-column:1/-1;";
            p.innerText = "⚠️ 该分组暂无记录";
            grid.appendChild(p);
          }
          gdiv.appendChild(grid);
          cont.appendChild(gdiv);
        }
        let allIds = new Set(GROUP_CONFIG.flatMap((g) => g.ids));
        let extra = [];
        for (let a of all) {
          if (
            !allIds.has(a.id) &&
            (a.title.toLowerCase().includes("fate") ||
              a.series_title?.toLowerCase().includes("fate"))
          )
            extra.push(a);
        }
        if (extra.length) {
          let ediv = document.createElement("div");
          ediv.className = "series-group";
          ediv.innerHTML = `<div class="group-title">🧩 其他 Fate 相关</div><div class="group-desc">未被分组的关联作品</div>`;
          let egrid = document.createElement("div");
          egrid.className = "anime-grid";
          extra.forEach((a) => egrid.appendChild(createCard(a)));
          ediv.appendChild(egrid);
          cont.appendChild(ediv);
        }
      }
      init();
    </script>
  </body>
</html>
