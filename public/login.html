<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>隔绝毋庸之辈</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap");

      body {
        margin: 0;
        background: #000;
        overflow: hidden;
        font-family: "ZCOOL XiaoWei", serif;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      .login-gate-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        text-align: center;
      }

      .shatter-heart {
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle, #300 0%, #000 85%);
        border: 4px solid #f00;
        filter: url(#distort);
        box-shadow:
          0 0 100px #f00,
          inset 0 0 80px #600;
      }

      .content-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 20;
      }

      .text-main {
        color: #ffffff;
        font-size: 3.5rem;
        letter-spacing: 20px;
        text-shadow: 0 0 20px #ff0000;
        margin: 0;
      }

      .text-sub {
        color: #990000;
        font-size: 1.8rem;
        letter-spacing: 12px;
        margin: 30px 0 60px;
      }

      .g_id_signin {
        display: inline-block !important;
        transform: scale(1.2);
        margin-top: 20px;
      }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  <body>
    <canvas id="shatterCanvas"></canvas>
    <div class="login-gate-container">
      <div class="shatter-heart"></div>
      <div class="content-layer">
        <h1 class="text-main">前方乃危险之路也</h1>
        <p class="text-sub">尔等可敢上前?</p>
        <div
          id="g_id_onload"
          data-client_id="1046534438268-vmrn92gmqjgdu0ro037d2nhsfmnq63ao.apps.googleusercontent.com"
          data-context="signin"
          data-ux_mode="popup"
          data-callback="handleGoogleLogin"
          data-auto_prompt="false"
        ></div>
        <div
          class="g_id_signin"
          data-type="standard"
          data-shape="rectangular"
          data-theme="outline"
          data-text="signin_with"
          data-size="large"
          data-logo_alignment="left"
        ></div>
      </div>
    </div>
    <svg style="display: none">
      <filter id="distort">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.01"
          numOctaves="5"
          seed="1"
        >
          <animate
            attributeName="seed"
            from="1"
            to="100"
            dur="25s"
            repeatCount="indefinite"
          />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" scale="80" />
      </filter>
    </svg>
    <script>
      const canvas = document.getElementById("shatterCanvas"),
        ctx = canvas.getContext("2d");
      let W = window.innerWidth,
        H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
      const colors = [
        "#FFD400",
        "#22D3EE",
        "#DA70D6",
        "#FB923C",
        "#FFFFFF",
        "#1E3A8A",
        "#22C55E",
      ];
      let particles = [];
      function drawShatter(x, y, angle, len, depth, color) {
        if (depth <= 0) return;
        const tx = x + Math.cos(angle) * len,
          ty = y + Math.sin(angle) * len;
        ctx.strokeStyle = color;
        ctx.lineWidth = depth * 1.5;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(tx, ty);
        ctx.stroke();
        if (Math.random() > 0.4)
          particles.push({
            x: tx,
            y: ty,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3,
            c: color,
            a: 1,
          });
        for (let i = 0; i < (Math.random() > 0.8 ? 3 : 2); i++)
          drawShatter(
            tx,
            ty,
            angle + (Math.random() - 0.5) * 1.8,
            len * 0.82,
            depth - 1,
            color,
          );
      }
      function loop() {
        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.fillRect(0, 0, W, H);
        if (Math.random() > 0.96)
          drawShatter(
            W / 2,
            H / 2,
            Math.random() * Math.PI * 2,
            160,
            7,
            colors[Math.floor(Math.random() * 7)],
          );
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.a -= 0.02;
          ctx.globalAlpha = p.a;
          ctx.fillStyle = p.c;
          ctx.fillRect(p.x, p.y, 2, 2);
          if (p.a <= 0) {
            particles.splice(i, 1);
            i--;
          }
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(loop);
      }
      window.onresize = () => {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
      };
      loop();
      async function handleGoogleLogin(response) {
        const idToken = response.credential;
        try {
          const res = await fetch("/auth/google/token", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: idToken }),
          });
          const data = await res.json();
          if (!data.success) {
            window.location.href = "/unauthorized.html";
            return;
          }
        } catch (err) {
          window.location.href = "/unauthorized.html";
          return;
        }
        const overlay = document.createElement("div");
        overlay.style.cssText =
          "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:10000; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-size:2rem; font-weight:bold;";
        overlay.innerHTML = "正在连接...";
        document.body.appendChild(overlay);
        const welcomeAudios = [
          "/audio/world1.m4a",
          "/audio/world2.m4a",
          "/audio/world3.m4a",
          "/audio/world4.m4a",
          "/audio/world5.m4a",
        ];
        const randomIndex = Math.floor(Math.random() * welcomeAudios.length);
        const audio = new Audio(welcomeAudios[randomIndex]);
        audio.volume = 0.5;
        try {
          await audio.play();
        } catch (e) {}
        await Promise.race([
          new Promise((resolve) => (audio.onended = resolve)),
          new Promise((resolve) => setTimeout(resolve, 5000)),
        ]);
        window.location.href = "/";
      }
    </script>
  </body>
</html>
