<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>形象设置 - 动漫资料库</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Long+Cang&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 2000;
            overflow: visible;
            pointer-events: none;
        }

        .dynamic-text {
            position: absolute;
            color: white;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            z-index: 2001;
            animation: fadeOut 0.8s forwards;
        }

        .dynamic-text.vertical {
            writing-mode: vertical-rl;
            white-space: normal;
        }

        @keyframes fadeOut {
            0% {
                opacity: 0.9;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1.5);
            }
        }

        .main-container {
            display: none;
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
        }

        .left-panel {
            position: absolute;
            left: 0;
            top: 0;
            width: 66.666%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        canvas {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: block;
            pointer-events: auto;
            cursor: pointer;
        }

        .result-panel {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 33.333%;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            overflow-y: auto;
            padding: 40px;
            z-index: 5;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .result-content {
            text-align: center;
            width: 100%;
        }

        .name-display {
            font-size: 2rem;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.9);
            margin: 20px 0;
            color: #fff;
        }

        .fullscreen-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .modal-box {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #ffd700;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 80%;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(5px);
        }

        .modal-box input,
        .modal-box textarea {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            margin-top: 10px;
        }

        .modal-box button {
            margin-top: 20px;
            background: #ffd700;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        .avatar-upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .avatar-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffd700;
            cursor: pointer;
            transition: 0.2s;
        }

        .avatar-preview:hover {
            opacity: 0.8;
        }

        .avatar-hint {
            font-size: 0.8rem;
            color: #aaa;
        }

        .particle {
            position: absolute;
            pointer-events: none;
            background: white;
            border-radius: 50%;
            animation: floatParticle 1.5s linear forwards;
        }

        @keyframes floatParticle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.8;
            }

            100% {
                transform: translate(-60px, -120px) scale(0);
                opacity: 0;
            }
        }

        @keyframes flash {
            0% {
                background: rgba(255, 255, 255, 0);
            }

            50% {
                background: rgba(255, 255, 255, 0.9);
            }

            100% {
                background: rgba(255, 255, 255, 0);
            }
        }

        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3000;
            animation: flash 0.3s ease-out;
        }

        .crop-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 10000;
            overflow: hidden;
        }

        .crop-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .crop-canvas-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #cropBackgroundCanvas,
        #cropForegroundCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #cropBackgroundCanvas {
            filter: blur(8px) brightness(0.7);
        }

        #cropForegroundCanvas {
            cursor: grab;
        }

        #cropForegroundCanvas:active {
            cursor: grabbing;
        }

        .drag-panel {
            position: fixed;
            background: transparent;
            border-radius: 60px;
            padding: 8px 20px;
            display: flex;
            gap: 20px;
            z-index: 10001;
            cursor: grab;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #ffd700;
            touch-action: none;
        }

        .drag-panel:active {
            cursor: grabbing;
        }

        .drag-panel button {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 8px 30px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .drag-panel button:hover {
            transform: scale(1.02);
        }
    </style>
</head>

<body>
    <div id="introOverlay" class="intro-overlay"></div>
    <div class="main-container" id="mainContainer">
        <div class="left-panel" id="leftPanel">
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="semiWheelCanvas"></canvas>
            </div>
        </div>
        <div class="result-panel" id="resultPanel">
            <div class="result-content">请点击扇形区域进行设置</div>
        </div>
    </div>

    <script>
        const navItems = ["名字", "称号", "简介", "外观设置", "位置", "名片", "返回"];
        let currentIndex = 0;
        let activeModal = false;
        let profile = {};
        let lastFont = null;
        let introTimeout = null;
        let canvas, ctx, wrapper, resultPanel, leftPanel;
        let canvasWidth = 0, canvasHeight = 0;
        let centerX = 0, centerY = 0, radius = 0;
        let glowAnimationFrame = null;
        let glowIntensity = 0;
        let glowDirection = 1;
        let particles = [];
        let particleAnimationFrame = null;
        let exitAudio = null;

        const PROFILE_KEY = 'user_profile';

        function showToast(message, duration = 2000) {
            const existingToast = document.querySelector('.toast-message');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, duration);
        }
        function loadProfile() {
            const defaultProfile = {
                name: '', title: '', bio: '',
                planet: '', country: '', region: '',
                avatar: '/avatars/default.png',
                avatarBorderColor: '#ffd700',
                nameColor: '#ffd700',
                bioColor: '#cccccc',
                commentColor: '#ffffff'
            };
            const saved = localStorage.getItem(PROFILE_KEY);
            if (saved) {
                try { return { ...defaultProfile, ...JSON.parse(saved) }; } catch (e) { }
            }
            return defaultProfile;
        }

        function saveProfile(updated) {
            profile = { ...profile, ...updated };
            localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
            window.dispatchEvent(new CustomEvent('profileUpdated', { detail: profile }));
            if (navItems[currentIndex] === '名片') renderResultPanel();
            syncProfileToServer();
        }

        async function syncProfileToServer() {
            try {
                await fetch('/api/user/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username: profile.name, bio: profile.bio, avatar: profile.avatar })
                });
            } catch (e) { console.warn('同步失败', e); }
        }

        profile = loadProfile();

        async function fetchCurrentAvatar() {
            try {
                const res = await fetch('/api/user/current', { credentials: 'include' });
                if (res.ok) {
                    const user = await res.json();
                    if (user.avatar && profile.avatar !== user.avatar) {
                        profile.avatar = user.avatar;
                        saveProfile({ avatar: user.avatar });
                        renderResultPanel();
                        const avatarImg = document.getElementById('avatarPreview');
                        if (avatarImg) avatarImg.src = user.avatar;
                    }
                }
            } catch (e) { console.warn('获取头像失败', e); }
        }

        let currentCropModal = null;

        function uploadAvatar() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/jpeg,image/png,image/gif,image/webp';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => showCropModal(img);
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }
        function showCropModal(img) {
            if (currentCropModal) return;

            // 全屏容器
            const modalDiv = document.createElement('div');
            modalDiv.style.cssText = `
        position: fixed;
        inset: 0;
        background: black;
        z-index: 10000;
        overflow: hidden;
    `;

            // 模糊背景图（铺满）
            const bgImg = document.createElement('img');
            bgImg.src = img.src;
            bgImg.style.cssText = `
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        object-fit:cover;
        filter: blur(10px) brightness(0.45);
        transform: scale(1.08);
        pointer-events:none;
    `;
            modalDiv.appendChild(bgImg);

            // 清晰图层（只显示在圆圈内）
            const clearImg = document.createElement('img');
            clearImg.src = img.src;
            clearImg.style.cssText = `
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        object-fit:cover;
        pointer-events:none;
        clip-path: circle(0px at 50% 50%);
        -webkit-clip-path: circle(0px at 50% 50%);
    `;
            modalDiv.appendChild(clearImg);

            // 圆圈框
            const circleDiv = document.createElement('div');
            circleDiv.style.cssText = `
        position:absolute;
        border:3px solid #ffd700;
        border-radius:50%;
        box-shadow:
            0 0 0 9999px rgba(0,0,0,0.55),
            0 0 25px rgba(255,215,0,0.5);
        cursor:grab;
        z-index:10001;
        touch-action:none;
    `;
            modalDiv.appendChild(circleDiv);

            // 按钮面板
            const dragPanel = document.createElement('div');
            dragPanel.style.cssText = `
        position:fixed;
        display:flex;
        gap:18px;
        padding:10px 20px;
        border:1px solid #ffd700;
        border-radius:60px;
        background:rgba(0,0,0,0.35);
        backdrop-filter: blur(8px);
        z-index:10002;
        touch-action:none;
    `;

            const confirmBtn = document.createElement('button');
            confirmBtn.textContent = '确认';

            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = '取消';

            [confirmBtn, cancelBtn].forEach(btn => {
                btn.style.cssText = `
            border:none;
            padding:10px 26px;
            border-radius:30px;
            background:#ffd700;
            color:#000;
            font-weight:bold;
            cursor:pointer;
        `;
            });

            dragPanel.appendChild(confirmBtn);
            dragPanel.appendChild(cancelBtn);
            modalDiv.appendChild(dragPanel);

            document.body.appendChild(modalDiv);
            currentCropModal = modalDiv;

            let containerWidth = 0;
            let containerHeight = 0;

            let circleSize = 0;
            let circleLeft = 0;
            let circleTop = 0;

            // 更新清晰区域
            function updateClip() {
                const cx = circleLeft + circleSize / 2;
                const cy = circleTop + circleSize / 2;
                const r = circleSize / 2;

                clearImg.style.clipPath = `circle(${r}px at ${cx}px ${cy}px)`;
                clearImg.style.webkitClipPath = `circle(${r}px at ${cx}px ${cy}px)`;
            }

            // 更新圆圈
            function updateCircle() {
                const rect = modalDiv.getBoundingClientRect();
                containerWidth = rect.width;
                containerHeight = rect.height;

                circleSize = Math.min(containerWidth, containerHeight) * 0.7;

                if (circleLeft === 0 && circleTop === 0) {
                    circleLeft = (containerWidth - circleSize) / 2;
                    circleTop = (containerHeight - circleSize) / 2;
                }

                circleLeft = Math.max(0, Math.min(circleLeft, containerWidth - circleSize));
                circleTop = Math.max(0, Math.min(circleTop, containerHeight - circleSize));

                circleDiv.style.width = circleSize + 'px';
                circleDiv.style.height = circleSize + 'px';
                circleDiv.style.left = circleLeft + 'px';
                circleDiv.style.top = circleTop + 'px';

                updateClip();
            }

            // ---------- 圆圈拖拽 ----------
            let draggingCircle = false;
            let startX = 0;
            let startY = 0;

            function getPoint(e) {
                if (e.touches && e.touches[0]) {
                    return {
                        x: e.touches[0].clientX,
                        y: e.touches[0].clientY
                    };
                }
                return {
                    x: e.clientX,
                    y: e.clientY
                };
            }

            function circleDown(e) {
                e.preventDefault();
                draggingCircle = true;

                const p = getPoint(e);
                const rect = circleDiv.getBoundingClientRect();

                startX = p.x - rect.left;
                startY = p.y - rect.top;
            }

            function circleMove(e) {
                if (!draggingCircle) return;
                e.preventDefault();

                const p = getPoint(e);

                circleLeft = p.x - startX;
                circleTop = p.y - startY;

                circleLeft = Math.max(0, Math.min(circleLeft, containerWidth - circleSize));
                circleTop = Math.max(0, Math.min(circleTop, containerHeight - circleSize));

                circleDiv.style.left = circleLeft + 'px';
                circleDiv.style.top = circleTop + 'px';

                updateClip();
            }

            function circleUp() {
                draggingCircle = false;
            }

            circleDiv.addEventListener('mousedown', circleDown);
            circleDiv.addEventListener('touchstart', circleDown, { passive: false });

            window.addEventListener('mousemove', circleMove);
            window.addEventListener('touchmove', circleMove, { passive: false });

            window.addEventListener('mouseup', circleUp);
            window.addEventListener('touchend', circleUp);

            // ---------- 面板位置 ----------
            function updatePanel() {
                dragPanel.style.left = (containerWidth - 230) + 'px';
                dragPanel.style.top = (containerHeight - 90) + 'px';
            }

            const resizeObserver = new ResizeObserver(() => {
                updateCircle();
                updatePanel();
            });

            resizeObserver.observe(modalDiv);

            updateCircle();
            updatePanel();

            // ---------- 确认裁剪 ----------
            confirmBtn.onclick = async () => {
                const bgRect = bgImg.getBoundingClientRect();

                const imgW = img.width;
                const imgH = img.height;

                const scale = Math.max(bgRect.width / imgW, bgRect.height / imgH);

                const drawW = imgW * scale;
                const drawH = imgH * scale;

                const offsetX = (bgRect.width - drawW) / 2;
                const offsetY = (bgRect.height - drawH) / 2;

                const srcX = (circleLeft - offsetX) / scale;
                const srcY = (circleTop - offsetY) / scale;
                const srcSize = circleSize / scale;

                const finalCanvas = document.createElement('canvas');
                finalCanvas.width = 400;
                finalCanvas.height = 400;

                const ctx = finalCanvas.getContext('2d');

                ctx.save();
                ctx.beginPath();
                ctx.arc(200, 200, 200, 0, Math.PI * 2);
                ctx.clip();

                ctx.drawImage(
                    img,
                    srcX, srcY, srcSize, srcSize,
                    0, 0, 400, 400
                );

                ctx.restore();

                finalCanvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('avatar', blob, 'avatar.png');

                    try {
                        const res = await fetch('/api/user/avatar', {
                            method: 'POST',
                            credentials: 'include',
                            body: formData
                        });

                        const data = await res.json();

                        if (data.success) {
                            profile.avatar = data.avatarUrl;
                            saveProfile({ avatar: data.avatarUrl });
                            showToast('头像更新成功');
                            renderResultPanel();
                        } else {
                            showToast('上传失败');
                        }

                    } catch (err) {
                        showToast('网络错误');
                    } finally {
                        modalDiv.remove();
                        currentCropModal = null;
                        resizeObserver.disconnect();
                    }

                }, 'image/png');
            };

            // ---------- 取消 ----------
            cancelBtn.onclick = () => {
                modalDiv.remove();
                currentCropModal = null;
                resizeObserver.disconnect();
            };
        }

        // =================== 扇形菜单及其它原有函数 ===================
        function resizeCanvas() {
            if (!wrapper || !canvas) return;
            const winHeight = window.innerHeight;
            const leftWidth = leftPanel.clientWidth;
            radius = Math.min(winHeight / 2, leftWidth * 0.8);
            canvasWidth = radius;
            canvasHeight = winHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';
            centerX = 0;
            centerY = canvasHeight / 2;
            wrapper.style.width = canvasWidth + 'px';
            wrapper.style.height = canvasHeight + 'px';
            canvas.style.top = '50%';
            canvas.style.transform = 'translateY(-50%)';
            drawWheel();
        }

        function getDisplayIndices() {
            const total = navItems.length;
            const prev = (currentIndex - 1 + total) % total;
            const next = (currentIndex + 1) % total;
            return [prev, currentIndex, next];
        }

        function drawSector(angleStart, angleEnd, isActive, label) {
            const radStart = angleStart * Math.PI / 180;
            const radEnd = angleEnd * Math.PI / 180;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, radStart, radEnd);
            ctx.closePath();
            const grad = ctx.createLinearGradient(centerX, centerY, centerX + radius, centerY);
            if (isActive) {
                grad.addColorStop(0, 'rgba(255, 215, 0, 0.8)');
                grad.addColorStop(0.5, 'rgba(255, 160, 0, 0.6)');
                grad.addColorStop(1, 'rgba(255, 80, 0, 0.4)');
                ctx.fillStyle = grad;
                ctx.shadowBlur = 20 + glowIntensity * 10;
                ctx.shadowColor = `rgba(255, 215, 0, ${0.5 + glowIntensity * 0.5})`;
                if (window.activeSectorRange) window.activeSectorRange = { start: angleStart, end: angleEnd };
            } else {
                grad.addColorStop(0, 'rgba(30,30,40,0.95)');
                grad.addColorStop(0.7, 'rgba(15,15,20,0.9)');
                grad.addColorStop(1, 'rgba(5,5,10,0.85)');
                ctx.fillStyle = grad;
                ctx.shadowBlur = 5;
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
            }
            ctx.fill();
            ctx.shadowBlur = 0;

            const midAngle = (angleStart + angleEnd) / 2;
            const radMid = midAngle * Math.PI / 180;
            const textRadius = radius * 0.5;
            const textX = centerX + Math.cos(radMid) * textRadius;
            const textY = centerY + Math.sin(radMid) * textRadius;
            ctx.save();
            ctx.translate(textX, textY);
            let rotateAngle = radMid;
            if (midAngle > 90 || midAngle < -90) rotateAngle += Math.PI;
            ctx.rotate(rotateAngle);
            let fontSize = isActive ? Math.max(20, radius * 0.1) : Math.max(16, radius * 0.08);
            if (label === '外观设置') fontSize *= 0.8;
            ctx.font = `bold ${fontSize}px "PingFang SC", "Microsoft YaHei", "Noto Sans SC"`;
            ctx.fillStyle = isActive ? '#fff' : '#ddd';
            ctx.fillText(label, 0, 0);
            if (isActive) {
                ctx.fillStyle = '#ffd700';
                ctx.fillText(label, -1, -1);
            }
            ctx.restore();
        }

        function drawWheel() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            const indices = getDisplayIndices();
            const startAngleDeg = -90;
            const sectorAngle = 180 / 3;
            window.activeSectorRange = null;
            for (let i = 0; i < 3; i++) {
                const angleStart = startAngleDeg + i * sectorAngle;
                const angleEnd = angleStart + sectorAngle;
                const isActive = (indices[i] === currentIndex);
                drawSector(angleStart, angleEnd, isActive, navItems[indices[i]]);
                if (isActive) window.activeSectorRange = { start: angleStart, end: angleEnd };
            }
        }

        function initParticles() {
            if (particleAnimationFrame) cancelAnimationFrame(particleAnimationFrame);
            function updateParticles() {
                if (!ctx || !window.activeSectorRange) return;
                if (Math.random() < 0.4) {
                    const angleDeg = window.activeSectorRange.start + Math.random() * (window.activeSectorRange.end - window.activeSectorRange.start);
                    const rad = angleDeg * Math.PI / 180;
                    const r = radius * (0.3 + Math.random() * 0.6);
                    const x = centerX + Math.cos(rad) * r;
                    const y = centerY + Math.sin(rad) * r;
                    particles.push({ x, y, life: 1, size: 2 + Math.random() * 4, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5 - 0.5 });
                }
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.02;
                    if (p.life <= 0 || p.x < 0 || p.x > canvasWidth || p.y < 0 || p.y > canvasHeight) {
                        particles.splice(i, 1);
                        i--;
                        continue;
                    }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 215, 0, ${p.life * 0.8})`;
                    ctx.fill();
                }
                particleAnimationFrame = requestAnimationFrame(updateParticles);
            }
            updateParticles();
        }

        function startGlowAnimation() {
            if (glowAnimationFrame) cancelAnimationFrame(glowAnimationFrame);
            function animate() {
                glowIntensity += 0.02 * glowDirection;
                if (glowIntensity >= 1) { glowIntensity = 1; glowDirection = -1; }
                else if (glowIntensity <= 0.2) { glowIntensity = 0.2; glowDirection = 1; }
                drawWheel();
                glowAnimationFrame = requestAnimationFrame(animate);
            }
            animate();
        }

        function getHitSector(mouseX, mouseY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const canvasX = (mouseX - rect.left) * scaleX;
            const canvasY = (mouseY - rect.top) * scaleY;
            const dx = canvasX - centerX;
            const dy = canvasY - centerY;
            if (Math.hypot(dx, dy) > radius) return -1;
            let angle = Math.atan2(dy, dx) * 180 / Math.PI;
            if (angle < -90) angle += 360;
            if (angle > 90) return -1;
            const sectorAngle = 180 / 3;
            let sectorIndex = Math.floor((angle + 90) / sectorAngle);
            if (sectorIndex < 0) sectorIndex = 0;
            if (sectorIndex > 2) sectorIndex = 2;
            const indices = getDisplayIndices();
            return indices[sectorIndex];
        }

        function onCanvasClick(e) {
            const sectorIdx = getHitSector(e.clientX, e.clientY);
            if (sectorIdx !== -1) {
                if (navItems[sectorIdx] === '返回') {
                    const flashDiv = document.createElement('div');
                    flashDiv.className = 'flash-overlay';
                    document.body.appendChild(flashDiv);
                    const overlay = document.createElement('div');
                    overlay.style.position = 'fixed';
                    overlay.style.top = 0;
                    overlay.style.left = 0;
                    overlay.style.width = '100%';
                    overlay.style.height = '100%';
                    overlay.style.backgroundColor = 'rgba(0,0,0,0.7)';
                    overlay.style.zIndex = 10000;
                    overlay.style.display = 'flex';
                    overlay.style.alignItems = 'center';
                    overlay.style.justifyContent = 'center';
                    overlay.style.color = 'white';
                    overlay.style.fontSize = '1.5rem';
                    overlay.innerHTML = '正在退出...';
                    document.body.appendChild(overlay);
                    const audio = new Audio('/audio/形象设置-退出.m4a');
                    audio.play().catch(e => console.log);
                    audio.onended = () => { window.location.href = '/'; };
                    setTimeout(() => { if (!audio.ended) window.location.href = '/'; }, 3000);
                    return;
                }
                if (sectorIdx === currentIndex) openModalForItem(currentIndex);
                else {
                    currentIndex = sectorIdx;
                    drawWheel();
                    renderResultPanel();
                    openModalForItem(currentIndex);
                }
            }
        }

        function onWheel(e) {
            e.preventDefault();
            let newIndex = currentIndex + (e.deltaY > 0 ? 1 : -1);
            const total = navItems.length;
            if (newIndex < 0) newIndex = total - 1;
            if (newIndex >= total) newIndex = 0;
            if (newIndex !== currentIndex) {
                currentIndex = newIndex;
                drawWheel();
                renderResultPanel();
            }
        }

        function initCanvasEvents() {
            canvas.addEventListener('click', onCanvasClick);
            canvas.addEventListener('wheel', onWheel);
            window.addEventListener('resize', () => resizeCanvas());
            startGlowAnimation();
            initParticles();
        }

        // ======================== 模态框 ========================
        function openModalForItem(index) {
            const item = navItems[index];
            if (item === '返回') return;
            if (activeModal) return;
            activeModal = true;
            const modal = document.createElement('div');
            modal.className = 'fullscreen-modal';
            document.body.appendChild(modal);
            let innerHtml = '';
            let onSave = null;

            switch (item) {
                case '名字':
                    innerHtml = `<div class="modal-box"><div style="color:#ffd700;">请输入汝之名，并回车或点击完成</div><input type="text" id="modalInput" maxlength="20" value="${profile.name || ''}"><button id="modalSave">完成</button></div>`;
                    onSave = () => { const val = document.getElementById('modalInput').value.trim(); if (val) { saveProfile({ name: val }); modal.remove(); activeModal = false; renderResultPanel(); showParticles(); } else showToast("名字不能为空"); };
                    break;
                case '称号':
                    innerHtml = `<div class="modal-box"><div style="color:#ffd700;">称号（不可超过10字）</div><input type="text" id="modalInput" maxlength="10" value="${profile.title || ''}"><button id="modalSave">完成</button></div>`;
                    onSave = () => { let val = document.getElementById('modalInput').value.trim(); if (val.length > 10) showToast("不得超过10字"); else { saveProfile({ title: val }); modal.remove(); activeModal = false; renderResultPanel(); } };
                    break;
                case '简介':
                    innerHtml = `<div class="modal-box"><div style="color:#ffd700; text-align:center;">在此之地 宣告汝之誓言</div><textarea id="modalInput" rows="5">${profile.bio || ''}</textarea><button id="modalSave">完成</button></div>`;
                    onSave = () => { const val = document.getElementById('modalInput').value; saveProfile({ bio: val }); modal.remove(); activeModal = false; renderResultPanel(); new Audio('/audio/誓言-配音.m4a').play().catch(e => console.log); };
                    break;
                case '外观设置':
                    innerHtml = `
        <div class="modal-box">
            <div class="avatar-upload-area">
                <img src="${profile.avatar}" class="avatar-preview" id="avatarPreview" onerror="this.src='/avatars/default.png'">
                <div class="avatar-hint">点击头像更换 (圆形裁剪)</div>
            </div>
            <div><label>头像边框颜色</label><input type="color" id="borderColor" value="${profile.avatarBorderColor}"></div>
            <div><label>名字颜色</label><input type="color" id="nameColor" value="${profile.nameColor}"></div>
            <div><label>简介颜色</label><input type="color" id="bioColor" value="${profile.bioColor}"></div>
            <div><label>评论文字颜色</label><input type="color" id="commentColor" value="${profile.commentColor}"></div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button id="modalSave">保存外观</button>
                <button id="resetAvatarBtn" style="background:#444; color:#ffd700;">默认头像</button>
            </div>
        </div>`;
                    onSave = () => {
                        const colors = {
                            avatarBorderColor: document.getElementById('borderColor').value,
                            nameColor: document.getElementById('nameColor').value,
                            bioColor: document.getElementById('bioColor').value,
                            commentColor: document.getElementById('commentColor').value
                        };
                        saveProfile(colors);
                        modal.remove(); activeModal = false; renderResultPanel();
                        showToast("外观已保存");
                    };
                    setTimeout(() => {
                        const avatarImg = document.getElementById('avatarPreview');
                        if (avatarImg) avatarImg.onclick = () => uploadAvatar();
                        const resetBtn = document.getElementById('resetAvatarBtn');
                        if (resetBtn) {
                            resetBtn.onclick = async () => {
                                try {
                                    const res = await fetch('/api/user/reset-avatar', { method: 'POST', credentials: 'include' });
                                    const data = await res.json();
                                    if (data.success) {
                                        profile.avatar = data.avatarUrl;
                                        saveProfile({ avatar: data.avatarUrl });
                                        const avatarImg = document.getElementById('avatarPreview');
                                        if (avatarImg) avatarImg.src = data.avatarUrl;
                                        showToast('已恢复为默认头像');
                                        renderResultPanel();
                                    } else {
                                        showToast('重置失败: ' + (data.error || '未知错误'));
                                    }
                                } catch (err) {
                                    console.error(err);
                                    showToast('网络错误，请重试');
                                }
                            };
                        }
                    }, 100);
                    break;
                case '位置':
                    innerHtml = `<div class="modal-box"><div><label>所处星球</label><input type="text" id="planet" value="${profile.planet || ''}"></div><div><label>所处国家</label><input type="text" id="country" value="${profile.country || ''}"></div><div><label>所处地区</label><input type="text" id="region" value="${profile.region || ''}"></div><button id="modalSave">保存位置</button></div>`;
                    onSave = () => { const planet = document.getElementById('planet').value.trim(); const country = document.getElementById('country').value.trim(); const region = document.getElementById('region').value.trim(); saveProfile({ planet, country, region }); modal.remove(); activeModal = false; renderResultPanel(); showToast("位置已保存"); };
                    break;
                case '名片':
                    modal.remove(); activeModal = false; renderResultPanel(); return;
                default: return;
            }
            modal.innerHTML = innerHtml;
            const btn = document.getElementById('modalSave');
            const inp = document.getElementById('modalInput');
            if (btn) btn.addEventListener('click', onSave);
            if (inp && inp.tagName === 'INPUT') inp.addEventListener('keypress', e => { if (e.key === 'Enter') onSave(); });
        }

        function showParticles() {
            const panel = document.getElementById('resultPanel');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.width = p.style.height = (2 + Math.random() * 12) + 'px';
                p.style.background = `hsl(${Math.random() * 360}, 100%, 70%)`;
                panel.appendChild(p);
                setTimeout(() => p.remove(), 1500);
            }
        }

        function renderResultPanel() {
            const panel = document.getElementById('resultPanel');
            const item = navItems[currentIndex];
            panel.innerHTML = '';
            const contentDiv = document.createElement('div');
            contentDiv.className = 'result-content';
            switch (item) {
                case '名字': contentDiv.innerHTML = `<div class="name-display" style="color:${profile.nameColor}">${profile.name || '未设置'}</div>`; break;
                case '称号': contentDiv.innerHTML = `<div class="name-display" style="color:${profile.nameColor}">${profile.title || '未设置'}</div>`; break;
                case '简介': contentDiv.innerHTML = `<div style="white-space:pre-wrap; line-height:1.6; font-size:1.2rem; color:${profile.bioColor}">${profile.bio || '未填写'}</div>`; break;
                case '外观设置': contentDiv.innerHTML = `<div>外观已应用，可在首页查看效果</div>`; break;
                case '位置': const loc = [profile.planet, profile.country, profile.region].filter(s => s).join(' · ') || '未填写'; contentDiv.innerHTML = `<div class="name-display">📍 ${loc}</div>`; break;
                case '名片': const locationStr = [profile.planet, profile.country, profile.region].filter(s => s).join(' · ') || '未填写'; contentDiv.innerHTML = `<div style="background:#111; border-radius:20px; padding:30px; max-width:500px; margin:0 auto; text-align:center; border:1px solid ${profile.avatarBorderColor}"><img src="${profile.avatar}" style="width:100px; height:100px; border-radius:50%; border:3px solid ${profile.avatarBorderColor}; margin-bottom:20px;" onerror="this.src='/avatars/default.png'"><h2 style="color:${profile.nameColor}">${profile.name || '未填写'}</h2><p style="color:${profile.nameColor}">称号：${profile.title || '未填写'}</p><p style="color:${profile.bioColor}">简介：${profile.bio || '未填写'}</p><p style="color:#aaa">位置：${locationStr}</p></div>`; break;
                case '返回': contentDiv.innerHTML = `<div>点击返回按钮退出设置</div>`; break;
                default: contentDiv.innerHTML = `<div>请选择设置项</div>`;
            }
            panel.appendChild(contentDiv);
        }

        async function checkAndPlayIntro() {
            try {
                const res = await fetch('/api/check-profile-intro');
                const data = await res.json();
                if (data.play) startIntroEffect();
                else showMainUI();
            } catch (e) { showMainUI(); }
        }

        function showMainUI() {
            const overlay = document.getElementById('introOverlay');
            if (overlay) overlay.remove();
            const mainContainer = document.getElementById('mainContainer');
            mainContainer.style.display = 'flex';
            canvas = document.getElementById('semiWheelCanvas');
            ctx = canvas.getContext('2d');
            wrapper = document.getElementById('canvasWrapper');
            resultPanel = document.getElementById('resultPanel');
            leftPanel = document.getElementById('leftPanel');
            resizeCanvas();
            initCanvasEvents();
            renderResultPanel();
            fetchCurrentAvatar();
            exitAudio = new Audio('/audio/形象设置-退出.m4a');
            exitAudio.load();
        }

        function startIntroEffect() {
            const overlay = document.getElementById('introOverlay');
            overlay.innerHTML = '';
            const textVariants = [
                "一旦确定 不可改变", "一旦確定 不可改變", "一但確定 不可改變",
                "一旦确定·不可改变", "一旦 确定 不可 改变", "一旦確定·不可改變",
                "一旦确定,不可改变", "一旦確定 不可改", "一旦確定 不可改變",
                "一旦確定 不可改變", "一旦確定 不可改變", "一旦確定 不可改變"
            ];
            const fontFamilies = [
                "'Noto Serif SC', serif", "'Noto Sans SC', sans-serif",
                "'ZCOOL KuaiLe', cursive", "'Ma Shan Zheng', cursive",
                "'Long Cang', cursive", "'STKaiti', 'KaiTi', '楷体', serif",
                "'STSong', 'SimSun', '宋体', serif", "'FangSong', '华文仿宋', '仿宋', serif",
                "'STLiti', 'LiSu', '隶书', serif", "'STXingkai', 'Xingkai SC', '行书', cursive",
                "'STXihei', 'Microsoft YaHei', sans-serif", "cursive", "fantasy", "monospace"
            ];
            const randomPos = () => ({ left: -20 + Math.random() * 140, top: -20 + Math.random() * 140 });
            function createOneText() {
                const span = document.createElement('div');
                span.className = 'dynamic-text';
                span.textContent = textVariants[Math.floor(Math.random() * textVariants.length)];
                const pos = randomPos();
                span.style.left = pos.left + '%';
                span.style.top = pos.top + '%';
                span.style.fontSize = (16 + Math.random() * 56) + 'px';
                let newFont;
                do { newFont = fontFamilies[Math.floor(Math.random() * fontFamilies.length)]; } while (newFont === lastFont && fontFamilies.length > 1);
                lastFont = newFont;
                span.style.fontFamily = newFont;
                const dir = Math.floor(Math.random() * 3);
                if (dir === 1) {
                    span.classList.add('vertical');
                    span.style.writingMode = 'vertical-rl';
                    span.style.whiteSpace = 'normal';
                } else if (dir === 2) {
                    span.style.transform = `rotate(${(Math.random() - 0.5) * 90}deg)`;
                }
                const duration = 0.6 + Math.random() * 0.6;
                span.style.animation = `fadeOut ${duration}s forwards`;
                overlay.appendChild(span);
                setTimeout(() => span.remove(), duration * 1000);
            }
            const endTime = Date.now() + 3000;
            function loop() {
                if (Date.now() >= endTime) {
                    if (introTimeout) clearTimeout(introTimeout);
                    overlay.style.opacity = '0';
                    setTimeout(() => showMainUI(), 500);
                    return;
                }
                const count = 2 + Math.floor(Math.random() * 5);
                for (let i = 0; i < count; i++) createOneText();
                const delay = 30 + Math.random() * 70;
                introTimeout = setTimeout(loop, delay);
            }
            loop();
        }

        checkAndPlayIntro();
    </script>
</body>

</html>
