<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Fate 系列 - 观测站</title>
    <style>
      body {
        background: #0a0a0a;
        color: #eee;
        font-family: system-ui;
        padding: 2rem;
      }
      .card {
        background: #1e1e1e;
        border-radius: 12px;
        padding: 1rem;
        margin: 1rem 0;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      .anime {
        width: 180px;
        background: #111;
        border-radius: 8px;
        padding: 10px;
        text-align: center;
      }
      .anime img {
        width: 100%;
        height: 240px;
        object-fit: cover;
        border-radius: 6px;
      }
      .error {
        color: #ff8888;
      }
    </style>
  </head>
  <body>
    <h1>✧ Fate 观测序列 ✧</h1>
    <div id="status">正在加载数据...</div>
    <div id="result" class="grid"></div>

    <script>
      (async function () {
        const statusDiv = document.getElementById("status");
        const resultDiv = document.getElementById("result");
        try {
          // 请求 Fate 相关动漫
          const url = "/api/anime/list?page=1&limit=100&keyword=Fate";
          console.log("请求:", url);
          const res = await fetch(url, { credentials: "include" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          const list = json.data || [];
          console.log("获取到数据:", list.length);
          if (list.length === 0) {
            statusDiv.innerHTML = "⚠️ 未检索到任何 Fate 数据，请检查数据库。";
            return;
          }
          statusDiv.innerHTML = `✅ 找到 ${list.length} 部作品，正在展示...`;
          // 清空并渲染卡片
          resultDiv.innerHTML = "";
          for (let anime of list) {
            const card = document.createElement("div");
            card.className = "anime";
            // 获取图片（兼容多种字段）
            let imgUrl =
              anime.image_url ||
              anime.cover ||
              anime.images?.jpg?.image_url ||
              "/images/default.jpg";
            card.innerHTML = `
                        <img src="${imgUrl}" onerror="this.src='/images/default.jpg'">
                        <div><strong>${escapeHtml(anime.title)}</strong></div>
                        <div style="font-size:0.8rem;color:#aaa;">${anime.season || ""}</div>
                    `;
            card.addEventListener("click", () => {
              const id = anime._id || anime.id;
              if (id) window.location.href = `/anime/${id}`;
            });
            resultDiv.appendChild(card);
          }
        } catch (err) {
          console.error(err);
          statusDiv.innerHTML = `<span class="error">加载失败: ${err.message}</span>`;
        }
      })();

      function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function (m) {
          if (m === "&") return "&amp;";
          if (m === "<") return "&lt;";
          if (m === ">") return "&gt;";
          return m;
        });
      }
    </script>
  </body>
</html>
