<!doctype html>
<html>
  <head>
    <title>Fate 测试</title>
  </head>
  <body>
    <pre id="out">加载中...</pre>
    <script>
      fetch("/api/anime/list?keyword=Fate&limit=5", { credentials: "include" })
        .then((r) => r.json())
        .then((d) => {
          document.getElementById("out").innerHTML =
            "✅ 成功！数量：" +
            d.data.length +
            "\n第一条：" +
            JSON.stringify(d.data[0], null, 2);
        })
        .catch((e) => {
          document.getElementById("out").innerHTML = "❌ 错误：" + e.message;
        });
    </script>
  </body>
</html>
