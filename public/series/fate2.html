<!doctype html>
<html>
  <head>
    <title>Fate 测试</title>
  </head>
  <body>
    <h1>数据测试</h1>
    <pre id="out">加载中...</pre>
    <script>
      fetch("/api/anime/list?keyword=Fate&limit=5", { credentials: "include" })
        .then((r) => r.json())
        .then((d) => {
          document.getElementById("out").innerHTML =
            `✅ 成功！共 ${d.data.length} 条，第一条：\n${JSON.stringify(d.data[0], null, 2)}`;
        })
        .catch((e) => {
          document.getElementById("out").innerHTML = "❌ 错误：" + e.message;
        });
    </script>
  </body>
</html>
