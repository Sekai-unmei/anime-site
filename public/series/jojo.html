<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>系列详情 - JOJO的奇妙冒险</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem;
      }

      .overall-card {
        background: #111;
        border-radius: 20px;
        padding: 20px;
        margin-bottom: 40px;
        display: flex;
        gap: 30px;
        align-items: center;
        border: 1px solid #333;
      }

      .overall-card img {
        width: 180px;
        height: 260px;
        object-fit: cover;
        border-radius: 12px;
      }

      .overall-info h2 {
        font-size: 2rem;
        margin-bottom: 12px;
        color: #ffd966;
      }

      .section {
        margin-bottom: 50px;
      }

      .section h3 {
        font-size: 1.8rem;
        border-left: 5px solid #ffd966;
        padding-left: 15px;
        margin-bottom: 20px;
      }

      .card-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 25px;
      }

      .anime-card {
        width: 200px;
        background: #1a1a1a;
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .anime-card:hover {
        transform: scale(1.02);
      }

      .anime-card img {
        width: 100%;
        height: 280px;
        object-fit: cover;
      }

      .anime-card p {
        text-align: center;
        padding: 10px;
        font-weight: bold;
      }

      .back-btn {
        display: inline-block;
        margin-top: 30px;
        padding: 10px 24px;
        background: #ffd966;
        color: #000;
        border-radius: 40px;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="overall-card" id="overall"></div>
      <div class="section" id="mainline">
        <h3>🔹 主线</h3>
        <div class="card-grid" id="mainlineGrid"></div>
      </div>
      <div class="section" id="son">
        <h3>🧬 儿子（承太郎）</h3>
        <div class="card-grid" id="sonGrid"></div>
      </div>
      <div class="section" id="daughter">
        <h3>🌸 女儿（徐伦）</h3>
        <div class="card-grid" id="daughterGrid"></div>
      </div>
      <div class="section" id="extra">
        <h3>✨ 番外・飙马野郎</h3>
        <div class="card-grid" id="extraGrid"></div>
      </div>
      <a href="/" class="back-btn">← 返回首页</a>
    </div>
    <script src="/js/common.js"></script>
    <script>
      const SERIES_TITLE = "jojo的奇妙冒险";
      function categorizeAnime(anime) {
        const title = anime.title;
        if (title.includes("第一季") || title === "jojo的奇妙冒险")
          return "overall";
        if (title.includes("星尘斗士")) return "mainline";
        if (title.includes("不灭钻石")) return "son";
        if (title.includes("黄金之风")) return "mainline";
        if (title.includes("石之海")) return "daughter";
        if (title.includes("飙马野郎")) return "extra";
        return "mainline";
      }
      async function loadAnimeData() {
        try {
          const res = await fetch(
            `/api/anime/series?title=${encodeURIComponent(SERIES_TITLE)}`,
          );
          const all = await res.json();
          if (!all.length) {
            document.getElementById("overall").innerHTML =
              '<div style="color:red">未找到相关动漫</div>';
            return;
          }
          const overallAnime = all.find(
            (a) => a.id === 178 || a.title === "jojo的奇妙冒险",
          );
          if (overallAnime) {
            document.getElementById("overall").innerHTML =
              `<img src="${overallAnime.image_url}"><div class="overall-info"><h2>📖 整体评价 · ${overallAnime.title}</h2><p>${overallAnime.description || "暂无简介"}</p><p>⭐ 推荐度：${overallAnime.rating} &nbsp; | &nbsp; 🏷️ ${overallAnime.genre?.join(" · ")}</p></div>`;
          }
          const groups = { mainline: [], son: [], daughter: [], extra: [] };
          all.forEach((anime) => {
            const cat = categorizeAnime(anime);
            if (cat !== "overall") groups[cat].push(anime);
          });
          const renderGroup = (containerId, animes) => {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = "";
            animes.forEach((anime) => {
              const card = document.createElement("div");
              card.className = "anime-card";
              card.innerHTML = `<img src="${anime.image_url}" onerror="this.src='/images/placeholder.png'"><p>${anime.title}</p>`;
              const animeId = anime._id;
              if (animeId)
                card.addEventListener(
                  "click",
                  () => (window.location.href = `/anime/${animeId}`),
                );
              else card.style.cursor = "not-allowed";
              container.appendChild(card);
            });
          };
          renderGroup("mainlineGrid", groups.mainline);
          renderGroup("sonGrid", groups.son);
          renderGroup("daughterGrid", groups.daughter);
          renderGroup("extraGrid", groups.extra);
          if (groups.mainline.length === 0)
            document.getElementById("mainline").style.display = "none";
          if (groups.son.length === 0)
            document.getElementById("son").style.display = "none";
          if (groups.daughter.length === 0)
            document.getElementById("daughter").style.display = "none";
          if (groups.extra.length === 0)
            document.getElementById("extra").style.display = "none";
        } catch (err) {
          console.error("加载失败", err);
        }
      }
      // ★ 新增：同步左下角头像
      syncUserAvatar();
      loadAnimeData();
    </script>
  </body>
</html>
