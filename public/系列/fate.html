<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fate系列 · 观测者推荐顺序 | 动漫资料库</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem;
      }
      .overall-card {
        background: #111;
        border-radius: 20px;
        padding: 20px;
        margin-bottom: 40px;
        display: flex;
        gap: 30px;
        align-items: center;
        border: 1px solid #333;
      }
      .overall-card img {
        width: 180px;
        height: 260px;
        object-fit: cover;
        border-radius: 12px;
      }
      .overall-info h2 {
        font-size: 2rem;
        margin-bottom: 12px;
        color: #ffd966;
      }
      .section {
        margin-bottom: 50px;
      }
      .section h3 {
        font-size: 1.8rem;
        border-left: 5px solid #ffd966;
        padding-left: 15px;
        margin-bottom: 20px;
      }
      .card-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 25px;
      }
      .anime-card {
        width: 200px;
        background: #1a1a1a;
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.2s;
      }
      .anime-card:hover {
        transform: scale(1.02);
      }
      .anime-card img {
        width: 100%;
        height: 280px;
        object-fit: cover;
      }
      .anime-card p {
        text-align: center;
        padding: 10px;
        font-weight: bold;
      }
      .back-btn {
        display: inline-block;
        margin-top: 30px;
        padding: 10px 24px;
        background: #ffd966;
        color: #000;
        border-radius: 40px;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 整体介绍卡片 -->
      <div class="overall-card" id="overallCard"></div>

      <!-- 各个分组（动态生成） -->
      <div id="groupsContainer"></div>

      <a href="/" class="back-btn">← 返回首页</a>
    </div>

    <script>
      // 定义分组规则
      const GROUPS = [
        {
          id: "main",
          name: "⚔️ 圣杯战争 · 主线核心轨迹",
          desc: "零之起点 → 无限剑制 → 天之杯",
          keywords: [
            "zero",
            "ubw",
            "unlimited blade",
            "heaven's feel",
            "天之杯",
            "命运之夜",
            "fate/stay night",
            "hf",
          ],
          exclude: [
            "嘉年华",
            "carnival",
            "魔法少女",
            "prisma",
            "grand order",
            "fgo",
            "埃尔梅罗",
            "事件簿",
            "卫宫家的饭",
          ],
        },
        {
          id: "derived",
          name: "🌙 正传衍生 · 魔术师与从者们",
          desc: "Apocrypha、Extra、strange Fake、事件簿等",
          keywords: [
            "apocrypha",
            "extra",
            "strange fake",
            "埃尔梅罗",
            "事件簿",
            "君主",
            "last encore",
          ],
          exclude: [],
        },
        {
          id: "fgo",
          name: "📀 Fate/Grand Order 人理修复篇",
          desc: "序章到第七特异点·巴比伦尼亚，终局所罗门",
          keywords: [
            "grand order",
            "fgo",
            "巴比伦尼亚",
            "卡美洛",
            "所罗门",
            "first order",
            "绝对魔兽战线",
            "神圣圆桌",
          ],
          exclude: [],
        },
        {
          id: "illya",
          name: "✨ 魔法少女☆伊莉雅 (平行世界)",
          desc: "伊莉雅的魔法少女平行世界",
          keywords: [
            "魔法少女☆伊莉雅",
            "魔法少女伊莉雅",
            "prisma",
            "illya",
            "雪下的誓言",
            "licht",
          ],
          exclude: [],
        },
        {
          id: "carnival",
          name: "🎭 英灵日常 · 嘉年华 & 泡面番",
          desc: "卫宫家的饭、幻想嘉年华、FGO搞笑短片",
          keywords: [
            "卫宫家的饭",
            "嘉年华",
            "carnival",
            "从漫画了解",
            "藤丸立香",
            "爱因兹贝伦咨询室",
          ],
          exclude: [],
        },
      ];

      // 辅助函数
      function escapeHtml(str) {
        if (!str) return "";
        return String(str).replace(/[&<>]/g, (m) =>
          m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;",
        );
      }

      async function loadFateData() {
        try {
          const res = await fetch(
            "/api/anime/list?page=1&limit=600&keyword=Fate",
            { credentials: "include" },
          );
          const json = await res.json();
          let allAnime = json.data || [];
          if (!allAnime.length) {
            document.getElementById("overallCard").innerHTML =
              '<div style="color:red">未找到Fate系列数据</div>';
            return;
          }

          // 找一个代表作作为整体介绍（例如 Fate/stay night 或 Fate/Zero）
          let overall =
            allAnime.find(
              (a) =>
                a.title.includes("Fate/stay night") ||
                a.title.includes("Fate/Zero"),
            ) || allAnime[0];
          document.getElementById("overallCard").innerHTML = `
        <img src="${overall.image_url || "/images/default.jpg"}" onerror="this.src='/images/default.jpg'">
        <div class="overall-info">
          <h2>📖 Fate 系列 · 动画总览</h2>
          <p>${overall.description ? escapeHtml(overall.description.substring(0, 200)) : "圣杯战争，魔术师与英灵的生死对决。"}</p>
          <p>⭐ 推荐度：${overall.rating || "未知"} &nbsp; | &nbsp; 🏷️ ${(overall.genre || []).join(" · ")}</p>
        </div>
      `;

          // 分组
          const groupsMap = {};
          GROUPS.forEach((g) => {
            groupsMap[g.id] = [];
          });

          for (let anime of allAnime) {
            const title = (anime.title || "").toLowerCase();
            const desc = (anime.description || "").toLowerCase();
            let assigned = false;
            for (let g of GROUPS) {
              if (
                g.exclude.some((kw) => title.includes(kw) || desc.includes(kw))
              )
                continue;
              if (
                g.keywords.some((kw) => title.includes(kw) || desc.includes(kw))
              ) {
                groupsMap[g.id].push(anime);
                assigned = true;
                break;
              }
            }
            if (!assigned) {
              if (!groupsMap["other"]) groupsMap["other"] = [];
              groupsMap["other"].push(anime);
            }
          }

          const container = document.getElementById("groupsContainer");
          container.innerHTML = "";

          // 渲染每个有作品的分组
          for (let g of GROUPS) {
            const animes = groupsMap[g.id];
            if (!animes || animes.length === 0) continue;
            const section = document.createElement("div");
            section.className = "section";
            section.innerHTML = `<h3>${g.name}</h3><div class="card-grid" id="grid-${g.id}"></div>`;
            container.appendChild(section);
            const grid = section.querySelector(`.card-grid`);
            animes.forEach((anime) => {
              const card = document.createElement("div");
              card.className = "anime-card";
              card.innerHTML = `
            <img src="${anime.image_url || "/images/default.jpg"}" onerror="this.src='/images/default.jpg'">
            <p>${escapeHtml(anime.title)}</p>
          `;
              card.addEventListener(
                "click",
                () =>
                  (window.location.href = `/anime/${anime._id || anime.id}`),
              );
              grid.appendChild(card);
            });
          }

          // 其他未分组作品
          if (groupsMap["other"] && groupsMap["other"].length) {
            const otherSection = document.createElement("div");
            otherSection.className = "section";
            otherSection.innerHTML = `<h3>🧩 其他观测记录 · 月之残响</h3><div class="card-grid" id="grid-other"></div>`;
            container.appendChild(otherSection);
            const otherGrid = otherSection.querySelector(`.card-grid`);
            groupsMap["other"].forEach((anime) => {
              const card = document.createElement("div");
              card.className = "anime-card";
              card.innerHTML = `<img src="${anime.image_url || "/images/default.jpg"}" onerror="this.src='/images/default.jpg'"><p>${escapeHtml(anime.title)}</p>`;
              card.addEventListener(
                "click",
                () =>
                  (window.location.href = `/anime/${anime._id || anime.id}`),
              );
              otherGrid.appendChild(card);
            });
          }
        } catch (err) {
          console.error(err);
          document.getElementById("overallCard").innerHTML =
            '<div style="color:red">加载失败，请刷新重试</div>';
        }
      }

      loadFateData();
    </script>
  </body>
</html>
